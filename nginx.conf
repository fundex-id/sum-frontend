server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Health check untuk probe Kubernetes
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Asset hasil build (nama file ber-hash) boleh di-cache lama
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: route React Router dikembalikan ke index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}